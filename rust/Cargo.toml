[workspace]
resolver = "2"
members = ["crates/*", "plugins/*", "tools/*"]
# tools/oracle is a Python tool, not a Cargo package.
# tools/witness is a standalone native host with its own [workspace].
exclude = ["olmcolorkey_cli", "tools/oracle", "tools/witness", "tools/fastrender"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
olm-math = { path = "crates/olm-math" }
olm-core = { path = "crates/olm-core" }
olm-ae = { path = "crates/olm-ae" }
after-effects = { git = "https://github.com/virtualritz/after-effects.git", rev = "0e0b197850f28c1bb24e8c82fce2e3d4c120d1e9" }
pipl = { git = "https://github.com/virtualritz/after-effects.git", rev = "0e0b197850f28c1bb24e8c82fce2e3d4c120d1e9" }
cc = "1"

[profile.release]
debug = 1

